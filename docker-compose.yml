version: '3.8'

services:
  backend:
    build: ./backend
    container_name: "portfolio-backend"
    network_mode: "host"
    env_file:
      - .env.local
    environment:
      - PORT=5000


  frontend:
    build:
      context: ./frontend
      args:
        - NEXT_PUBLIC_BACKEND_URL=http://localhost:5000
    container_name: "portfolio-frontend"
    network_mode: "host"
    env_file:
      - .env.local
    depends_on:
      - backend

  mongodb:
    image: mongo:7
    user: "1000:1000"
    container_name: mongodb
    restart: unless-stopped
    ports:
      - "0.0.0.0:27017:27017"
    volumes:
      - ${VOLUMES_BASE}/mongodb:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
    command: mongod --auth --bind_ip_all
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 25s

  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    restart: unless-stopped
    ports:
      - "0.0.0.0:6333:6333"
      - "0.0.0.0:6334:6334"
    volumes:
      - ${VOLUMES_BASE}/qdrant:/qdrant/storage
      - ./qdrant/config:/qdrant/config:ro
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_MASTER_KEY}
      QDRANT__SERVICE__READ_ONLY_API_KEY: ${QDRANT_READONLY_KEY}
    healthcheck:
      test: ["CMD", "bash", "-c", "cat </dev/null >/dev/tcp/127.0.0.1/6333"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s

  neo4j:
    image: neo4j:2026.05.0
    user: "1000:1000"
    container_name: neo4j
    restart: unless-stopped
    ports:
      - "0.0.0.0:7474:7474"
      - "0.0.0.0:7687:7687"
    volumes:
      - "${VOLUMES_BASE}/neo4j/data:/data"
      - "${VOLUMES_BASE}/neo4j/logs:/logs"
      - "${VOLUMES_BASE}/neo4j/import:/import"
      - "${VOLUMES_BASE}/neo4j/plugins:/plugins"
    environment:
      NEO4J_AUTH: "${NEO4J_USERNAME}/${NEO4J_PASSWORD}"
      NEO4J_PLUGINS: '["apoc", "graph-data-science"]'
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*,gds.*"
      NEO4J_dbms_security_procedures_allowlist: "apoc.*,gds.*"
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "${NEO4J_USERNAME}", "-p", "${NEO4J_PASSWORD}", "RETURN 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
